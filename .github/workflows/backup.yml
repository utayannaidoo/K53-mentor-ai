name: backup

# Nightly encrypted database backup.
#
# Supabase's Free plan has no point-in-time recovery and no restore path worth
# relying on, so until the project is on Pro this workflow *is* the backup. It
# is not PITR — it restores to last night, not to last minute — but at this
# data volume that is the difference between a bad hour and losing the
# business.
#
# Two secrets are required (repo Settings → Secrets and variables → Actions):
#
#   SUPABASE_DB_URL     Session-pooler connection string, WITH the password.
#                       Supabase dashboard → Connect → Session pooler. It looks
#                       like:
#                         postgresql://postgres.<ref>:<pw>@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
#                       It MUST be the session pooler on port 5432. Port 6543
#                       is the transaction pooler and pg_dump cannot use it —
#                       it needs session-level state the transaction pooler
#                       does not keep. The direct `db.<ref>.supabase.co` host
#                       resolves to IPv6 only, and GitHub's runners have no
#                       IPv6, so that one fails here with a confusing
#                       "could not connect" no matter how right the password is.
#
#   SUPABASE_DB_PASSWORD  OPTIONAL, and the reason this setup stops being
#                       fragile. Just the database password, on its own, with
#                       no URI around it. When set it is used verbatim and
#                       every parsing and percent-encoding question disappears.
#                       Set it. The URI-parsing path is a fallback.
#
#   BACKUP_PASSPHRASE   Any long random string. The dump is symmetrically
#                       encrypted with it. Store it somewhere that is NOT this
#                       repo and NOT the Supabase dashboard — a password
#                       manager. A backup you cannot decrypt is not a backup,
#                       and this is the single point of failure for the whole
#                       scheme.
#
# Restoring: docs/ops/backup-restore.md. Read it before you need it.

on:
  schedule:
    # 02:10 UTC = 04:10 SAST. Deliberately off the hour — GitHub's scheduler
    # queues heavily on the hour and can delay a run by 20+ minutes.
    - cron: "10 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    # Never run from a fork: the secrets would not exist and the job would fail
    # nightly for whoever forked it.
    if: github.repository == 'utayannaidoo/K53-mentor-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL 17 client
        # The server is Postgres 17.6. Ubuntu's default client is 16, and
        # pg_dump refuses outright when its major version is older than the
        # server's — so the stock runner cannot take this backup at all.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Installing the package is not enough, and this is the part that
          # bit. The runner image ships PostgreSQL 16 and its binaries win the
          # PATH, so bare `pg_dump` stayed 16.14 even with 17.11 correctly
          # installed alongside it, and the run then failed at the very end
          # with "server version mismatch". Address the versioned binary
          # directly; there is nothing to resolve and no race to lose.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error::postgresql-client-17 installed but $PG_DUMP is missing. The PGDG layout changed; locate the v17 pg_dump and update this path."
            exit 1
          fi

          # Assert, do not merely print. The previous version of this step ran
          # `pg_dump --version`, printed 16.14, and carried on regardless: the
          # check existed and proved nothing, because nothing read it.
          VERSION="$("$PG_DUMP" --version)"
          echo "$VERSION"
          case "$VERSION" in
            *"(PostgreSQL) 17."*) ;;
            *)
              echo "::error::Expected a PostgreSQL 17 pg_dump, got: $VERSION"
              echo "::error::The server is 17.6, and pg_dump refuses to run when its major version trails the server's."
              exit 1
              ;;
          esac
          echo "PG_DUMP=$PG_DUMP" >> "$GITHUB_ENV"

      - name: Dump public + auth schemas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. See the header of this workflow."
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          # Two things about that connection string have to be undone before
          # libpq will accept it, and the operator should have to remember
          # neither.
          #
          # 1. The dashboard appends `?pgbouncer=true`. That is a hint for ORM
          #    connection pools, not a libpq parameter, and pg_dump rejects the
          #    whole URI over it. Drop the query string entirely — that also
          #    covers connection_limit, pool_timeout and whatever gets added
          #    later — then re-add the one parameter that matters.
          #
          # 2. The password is pulled OUT of the URI rather than encoded into
          #    it. A Supabase-generated password can contain @ : / [ ] and #,
          #    every one of which is URI syntax. This is not hypothetical: a
          #    real run failed trying to resolve the host
          #    "15]@aws-0-eu-west-1.pooler.supabase.com", which is a fragment
          #    of the password that libpq read as the start of the hostname.
          #    Splitting on the LAST @ (a host part never contains one) and the
          #    FIRST : of the userinfo makes every such character safe, with no
          #    encoding step and nothing to get wrong.
          #
          # sslmode=require is not merely restoring a default: libpq's default
          # is `prefer`, which silently falls back to plaintext when TLS
          # negotiation fails. This dump crosses the public internet carrying
          # names and email addresses, so that fallback is not acceptable.
          BASE="${SUPABASE_DB_URL%%\?*}"
          AFTER_SCHEME="${BASE#*://}"
          USERINFO="${AFTER_SCHEME%@*}"
          HOSTPART="${AFTER_SCHEME##*@}"
          DB_USER="${USERINFO%%:*}"

          # A password inside a URI is percent-encoded — that is what the URI
          # form requires — and libpq decodes it on the way in. Lifting the
          # password out of the URI by hand is what makes @ : / [ ] safe to
          # have in it, but it also skips that decode, so a password with any
          # special character in it arrived mangled and the server answered
          # "password authentication failed". That was a bug introduced here,
          # not a wrong password, and it cost a round trip to find. Hence the
          # decode below.
          #
          # SUPABASE_DB_PASSWORD short-circuits the entire business: set that
          # secret and the password is used exactly as given, with no parsing,
          # no decoding, and nothing left to get wrong. It is the recommended
          # setup for precisely that reason.
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD"
            PW_SOURCE="SUPABASE_DB_PASSWORD secret, used verbatim"
          else
            PGPASSWORD="$(RAW_PW="${USERINFO#*:}" python3 -c \
              "import os,sys,urllib.parse; sys.stdout.write(urllib.parse.unquote(os.environ['RAW_PW']))")"
            PW_SOURCE="extracted from SUPABASE_DB_URL and percent-decoded"
          fi
          export PGPASSWORD
          # Mask it explicitly. GitHub masks the secret only as a whole string,
          # so the password alone would otherwise print in the clear.
          echo "::add-mask::$PGPASSWORD"

          # Enough to diagnose the next failure, not enough to reveal anything.
          # Four failed runs here were each diagnosed from a single line of
          # output; these are the lines that would have shortened that.
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::No password could be resolved. Either SUPABASE_DB_URL has no password in it, or set the SUPABASE_DB_PASSWORD secret."
            exit 1
          fi
          printf 'password: %s, %s characters' "$PW_SOURCE" "${#PGPASSWORD}"
          case "$PGPASSWORD" in
            " "*|*" ") printf ' — WARNING: leading/trailing whitespace, almost certainly a copy-paste artefact' ;;
          esac
          printf '\n'
          if [ "$PGPASSWORD" != "${PGPASSWORD#*[}" ] || [ "$PGPASSWORD" != "${PGPASSWORD#*]}" ]; then
            echo "::warning::Password contains square brackets. If it still looks like the dashboard's [YOUR-PASSWORD] placeholder, that placeholder was never replaced."
          fi


          # ── Preflight ──────────────────────────────────────────────────────
          # Everything below turns a misleading failure into an accurate one.
          # Pointing pg_dump at the wrong pooler produces "password
          # authentication failed", which sends you off to check a password
          # that was never the problem. That happened here, and cost a round
          # trip, so the shape is now checked before anything connects.
          HOSTNAME_ONLY="${HOSTPART%%:*}"
          PORT="${HOSTPART#*:}"; PORT="${PORT%%/*}"

          case "$HOSTNAME_ONLY" in
            *pooler.supabase.com)
              # The transaction pooler cannot serve pg_dump — it does not keep
              # the session state pg_dump relies on. Same host, different port,
              # so this is a safe and unambiguous correction rather than an
              # error worth failing over.
              if [ "$PORT" = "6543" ]; then
                echo "::warning::Connection string uses port 6543 (transaction pooler). Rewriting to 5432 (session pooler), which is the one pg_dump can use."
                HOSTPART="${HOSTPART/:6543/:5432}"
              fi
              # The pooler authenticates on a username carrying the project
              # ref. A bare "postgres" is rejected with a password error, which
              # is the single most misleading message in this whole setup.
              case "$DB_USER" in
                *.*) : ;;
                *)
                  echo "::error::Username in SUPABASE_DB_URL is '$DB_USER', but the pooler needs the project ref in the username — 'postgres.<project-ref>', e.g. postgres.aghurpwdvupuglztemaa."
                  echo "::error::This is what produces 'password authentication failed for user \"postgres\"'. Your password is almost certainly fine."
                  echo "::error::Fix: Supabase dashboard → Connect → Session pooler (NOT Transaction pooler, NOT Direct connection), and copy that URI."
                  exit 1
                  ;;
              esac
              ;;
            db.*.supabase.co)
              echo "::error::SUPABASE_DB_URL points at the direct host '$HOSTNAME_ONLY', which resolves to IPv6 only. GitHub runners have no IPv6, so this can never connect."
              echo "::error::Fix: Supabase dashboard → Connect → Session pooler, and copy that URI instead."
              exit 1
              ;;
          esac

          CLEAN_URL="postgresql://${DB_USER}@${HOSTPART}?sslmode=require"
          echo "Connecting as '$DB_USER' to '${HOSTPART%%/*}'"

          # public = every table the app owns. auth = the accounts themselves;
          # without it a restore gives you a database full of progress rows
          # belonging to users who no longer exist and cannot log in.
          # storage is deliberately excluded — verified empty (0 buckets, 0
          # objects); the app serves its 439 sign images from /public.
          # Ownership and grants are kept rather than stripped: the realistic
          # restore target is another Supabase project, where the roles the
          # dump references (supabase_auth_admin, anon, authenticated) already
          # exist. See the restore doc for the plain-Postgres case.
          "$PG_DUMP" "$CLEAN_URL" \
            --schema=public \
            --schema=auth \
            --no-comments \
            --quote-all-identifiers \
            --file="k53-$STAMP.sql"

          ls -lh "k53-$STAMP.sql"

      - name: Verify the dump is real
        # A backup job whose value silently drops to zero is worse than no
        # backup job, because it also removes the worry that would have made
        # someone check.
        #
        # This runs on the plain .sql, before compression. The previous version
        # checked the gzip with zgrep and reported a table as missing that the
        # dump almost certainly contained — so the check now reads the file
        # directly, and when it does fail it prints what it actually found
        # instead of only what it wanted.
        run: |
          set -euo pipefail
          FILE="k53-$STAMP.sql"

          SIZE=$(stat -c%s "$FILE")
          echo "dump size: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "::error::Dump is only $SIZE bytes — implausibly small. Treating as failed."
            exit 1
          fi

          echo "CREATE TABLE statements: $(grep -c '^CREATE TABLE ' "$FILE" || true)"
          echo "schemas present:"
          grep -oE '^CREATE TABLE "?[a-z_]+"?\.' "$FILE" | sort | uniq -c | sed 's/^/  /' || true

          # Matched with a regex that tolerates either quoting style. The exact
          # rendering of a CREATE TABLE line is a pg_dump implementation
          # detail and has changed between versions; the table being present
          # is the thing actually worth asserting.
          fail=0
          need_table() {
            if grep -qE "^CREATE TABLE \"?$1\"?\.\"?$2\"?" "$FILE"; then
              echo "  ok   $1.$2"
            else
              echo "  MISS $1.$2"
              fail=1
            fi
          }
          need_data() {
            if grep -qE "^COPY \"?$1\"?\.\"?$2\"?" "$FILE"; then
              echo "  ok   $1.$2 (data)"
            else
              echo "  MISS $1.$2 (data)"
              fail=1
            fi
          }

          need_table public subscriptions
          need_table public profiles
          need_table auth users
          need_data  auth users

          if [ "$fail" -ne 0 ]; then
            echo "::error::The dump is missing something it must contain — see the MISS lines above."
            echo "::error::If only the auth entries are missing, the database role cannot read the auth schema and logins would not survive a restore."
            echo "--- first 25 CREATE TABLE lines actually in the dump ---"
            grep '^CREATE TABLE ' "$FILE" | head -25 || true
            exit 1
          fi
          echo "All expected structures present."

          gzip -9 "$FILE"
          ls -lh "$FILE.gz"

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set. Refusing to upload an unencrypted dump."
            exit 1
          fi
          # The dump contains names, email addresses and subscription records —
          # personal information under POPIA. It does not get uploaded in the
          # clear, even to a private repository's artifact storage.
          gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "k53-$STAMP.sql.gz.gpg" \
            "k53-$STAMP.sql.gz"
          rm -f "k53-$STAMP.sql.gz"
          ls -lh "k53-$STAMP.sql.gz.gpg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: k53-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
